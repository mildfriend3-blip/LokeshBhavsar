<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HyperEdge</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; user-select: none; }
    body { background-color: #F0F2F5; margin: 0; padding: 0; font-family: 'Roboto', sans-serif; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState } = React;

    function App() {
      const [currentTab, setCurrentTab] = useState<'dashboard' | 'report' | 'vault'>('dashboard');
      const [isOnline, setIsOnline] = useState(true);
      const [selectedChip, setSelectedChip] = useState("Sadak");
      const [isSyncing, setIsSyncing] = useState(false);
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleSaveToVault = () => {
        showToast("✓ Saved to Offline Vault (ChaCha20)");
        setCurrentTab('vault');
      };

      const handleSyncNow = () => {
        setIsSyncing(true);
        setTimeout(() => {
          setIsSyncing(false);
          showToast("✓ All uploads synced successfully!");
        }, 1200);
      };

      return (
        <div className="w-full max-w-md h-[100dvh] bg-[#FEF7FF] shadow-2xl flex flex-col relative overflow-hidden text-slate-800 sm:rounded-[32px] sm:h-[844px] sm:border-[8px] sm:border-slate-800">
          
          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-xs font-medium border border-slate-700">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* SCREEN 1: DASHBOARD */}
          {currentTab === 'dashboard' && (
            <div className="flex-1 flex flex-col relative">
              {/* CenterAlignedTopAppBar */}
              <header className="bg-[#FEF7FF] border-b border-slate-200/80 px-4 py-3 flex items-center justify-between z-10">
                <div className="w-20"></div>
                <h1 className="text-xl font-bold text-slate-900 text-center flex-1">HyperEdge</h1>
                <div className="flex items-center gap-2">
                  <button 
                    onClick={() => setIsOnline(!isOnline)}
                    className={`px-2.5 py-0.5 rounded-lg text-xs font-bold border ${
                      isOnline ? 'bg-[#E8F5E9] text-[#1B5E20] border-[#81C784]' : 'bg-[#FFEBEE] text-[#B71C1C] border-[#E57373]'
                    }`}
                  >
                    {isOnline ? "ONLINE" : "OFFLINE"}
                  </button>
                  <span className="bg-[#E65100] text-white text-xs font-bold px-2 py-0.5 rounded">
                    2/8 Sync
                  </span>
                </div>
              </header>

              {/* Main Content: 70% height grey Box with Icons.Default.Place */}
              <div className="flex-1 flex flex-col justify-start">
                <div className="w-full h-[70%] bg-[#E0E0E0] flex items-center justify-center relative">
                  <svg className="w-14 h-14 text-slate-600" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
                  </svg>
                  <div className="absolute bottom-4 bg-white/80 backdrop-blur-sm px-3 py-1 rounded text-xs font-medium text-slate-600">
                    Map Placeholder (70% viewport)
                  </div>
                </div>
              </div>

              {/* ExtendedFloatingActionButton at bottom */}
              <div className="absolute bottom-20 left-4 right-4 z-20">
                <button
                  onClick={() => setCurrentTab('report')}
                  className="w-full py-4 bg-[#E65100] hover:bg-orange-700 text-white font-bold rounded-2xl shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition-all"
                >
                  <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
                  </svg>
                  <span>Report Issue</span>
                </button>
              </div>
            </div>
          )}

          {/* SCREEN 2: REPORT ISSUE */}
          {currentTab === 'report' && (
            <div className="flex-1 flex flex-col p-4">
              {/* TopAppBar with Back */}
              <div className="flex items-center gap-3 pb-3 border-b border-slate-200">
                <button 
                  onClick={() => setCurrentTab('dashboard')} 
                  className="p-1 rounded-full hover:bg-slate-100"
                >
                  <svg className="w-6 h-6 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                  </svg>
                </button>
                <h2 className="text-lg font-bold text-slate-900">Report Issue</h2>
              </div>

              {/* 1. Large Box (height 300px, black bg) camera preview */}
              <div className="w-full h-[300px] bg-black rounded-lg mt-4 relative overflow-hidden flex flex-col justify-end">
                <img 
                  src="https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=800&auto=format&fit=crop&q=80" 
                  alt="Road" 
                  className="absolute inset-0 w-full h-full object-cover opacity-70"
                />
                <div className="relative z-10 bg-black/65 px-3 py-2.5 flex items-center">
                  <span className="text-white text-xs font-medium">Edge AI Active: Pothole Detected (94%)</span>
                </div>
              </div>

              {/* 2. Scrollable Row with 3 FilterChips */}
              <div className="flex items-center gap-2 overflow-x-auto no-scrollbar mt-4 py-1">
                {["Sadak", "Kachra", "Bijli"].map((chip) => {
                  const isSel = selectedChip === chip;
                  return (
                    <button
                      key={chip}
                      onClick={() => setSelectedChip(chip)}
                      className={`px-4 py-1.5 rounded-lg text-xs font-semibold border transition-colors ${
                        isSel 
                          ? 'bg-[#E8DEF8] text-[#1D192B] border-[#79747E]' 
                          : 'bg-white text-slate-700 border-slate-300'
                      }`}
                    >
                      {chip}
                    </button>
                  );
                })}
              </div>

              {/* 3. Spacer */}
              <div className="flex-1"></div>

              {/* 4. Large Button at bottom (fillMaxWidth) */}
              <div className="mb-20">
                <button
                  onClick={handleSaveToVault}
                  className="w-full py-3.5 bg-[#E65100] hover:bg-orange-700 text-white font-bold rounded-lg shadow active:scale-[0.98] transition-all text-sm"
                >
                  Save to Offline Vault (ChaCha20)
                </button>
              </div>
            </div>
          )}

          {/* SCREEN 3: OFFLINE VAULT */}
          {currentTab === 'vault' && (
            <div className="flex-1 flex flex-col p-4">
              <div className="pb-3 border-b border-slate-200">
                <h2 className="text-xl font-bold text-slate-900">Sync Vault</h2>
              </div>

              {/* Row with "2 Pending Uploads" and "Sync Now" button */}
              <div className="flex items-center justify-between mt-4">
                <span className="text-base font-semibold text-slate-900">2 Pending Uploads</span>
                <button
                  onClick={handleSyncNow}
                  className="px-4 py-2 bg-[#6750A4] text-white font-semibold rounded-lg text-xs hover:bg-[#583f94] transition-all"
                >
                  {isSyncing ? "Syncing..." : "Sync Now"}
                </button>
              </div>

              {/* LinearProgressIndicator at 0.5f progress */}
              <div className="w-full bg-slate-200 h-1.5 rounded-full mt-3 overflow-hidden">
                <div className="bg-[#6750A4] h-full transition-all duration-300 rounded-full" style={{ width: '50%' }}></div>
              </div>

              {/* LazyColumn of mock cards */}
              <div className="space-y-3 mt-4 overflow-y-auto no-scrollbar pb-24">
                {/* Card 1 */}
                <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200/80 space-y-2">
                  <h3 className="text-base font-bold text-slate-900">Ticket #HYE-0042</h3>
                  <p className="text-xs text-slate-600">Category: Sadak | Size: 2.4MB</p>
                  <div className="flex items-center gap-1.5 text-slate-500 text-xs pt-1">
                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" />
                    </svg>
                    <span>Encrypted locally</span>
                  </div>
                </div>

                {/* Card 2 */}
                <div className="bg-white rounded-xl p-4 shadow-sm border border-slate-200/80 space-y-2">
                  <h3 className="text-base font-bold text-slate-900">Ticket #HYE-0043</h3>
                  <p className="text-xs text-slate-600">Category: Kachra | Size: 1.8MB</p>
                  <div className="flex items-center gap-1.5 text-slate-500 text-xs pt-1">
                    <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
                      <path fillRule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clipRule="evenodd" />
                    </svg>
                    <span>Encrypted locally</span>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* Bottom Navigation */}
          <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200 px-6 py-2 flex items-center justify-around z-30 shadow-md">
            <button 
              onClick={() => setCurrentTab('dashboard')} 
              className={`flex flex-col items-center gap-1 ${currentTab === 'dashboard' ? 'text-[#E65100]' : 'text-slate-400'}`}
            >
              <svg className="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5a2.5 2.5 0 010-5 2.5 2.5 0 010 5z"/>
              </svg>
              <span className="text-[10px] font-semibold">Dashboard</span>
            </button>

            <button 
              onClick={() => setCurrentTab('report')} 
              className={`flex flex-col items-center gap-1 ${currentTab === 'report' ? 'text-[#E65100]' : 'text-slate-400'}`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
              </svg>
              <span className="text-[10px] font-semibold">Report</span>
            </button>

            <button 
              onClick={() => setCurrentTab('vault')} 
              className={`flex flex-col items-center gap-1 ${currentTab === 'vault' ? 'text-[#E65100]' : 'text-slate-400'}`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
              </svg>
              <span className="text-[10px] font-semibold">Sync Vault</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
