<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HyperEdge | Cloud Node</title>
  
  <!-- CDNs for Tailwind, React, Babel, and Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');
    body { font-family: 'Inter', sans-serif; background-color: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
    
    /* Premium Map Background Simulation */
    .map-bg {
      background-color: #f8fafc;
      background-image: 
        radial-gradient(#cbd5e1 1px, transparent 1px),
        radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 40px 40px;
      background-position: 0 0, 20px 20px;
      position: absolute; inset: 0; z-index: 0;
    }
    
    /* GPS Pulsing Dot */
    .gps-ring {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      width: 80px; height: 80px; background: rgba(37, 99, 235, 0.15);
      border-radius: 50%; animation: pulse-ring 2.5s infinite cubic-bezier(0.215, 0.61, 0.355, 1);
    }
    .gps-dot {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      width: 20px; height: 20px; background: #2563eb;
      border-radius: 50%; border: 4px solid white; box-shadow: 0 4px 15px rgba(37,99,235,0.4);
    }
    
    @keyframes pulse-ring {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(2.5); opacity: 0; }
    }

    /* Custom Scrollbar */
    .hide-scroll::-webkit-scrollbar { display: none; }
    .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // Setup global variables so React can access the backend
    window.firebaseReady = false;
    
    try {
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'hyperedge-demo';
      if (typeof __firebase_config !== 'undefined') {
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        
        // Strict Path Rule: artifacts/{appId}/public/data/reports
        window.dbCollection = collection(db, 'artifacts', appId, 'public', 'data', 'reports');
        window.dbAddDoc = addDoc;

        // Auth before query rule
        const initAuth = async () => {
          const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
          if (token) {
            await signInWithCustomToken(auth, token);
          } else {
            await signInAnonymously(auth);
          }
          window.firebaseReady = true;
          window.dispatchEvent(new Event('backend-ready'));
        };
        initAuth();
      }
    } catch (error) {
      console.warn("Backend initialization skipped or failed. Running in Local Mode.", error);
    }
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
      // Core State
      const [isOnline, setIsOnline] = useState(navigator.onLine);
      const [backendConnected, setBackendConnected] = useState(window.firebaseReady);
      
      // Form State
      const [issueType, setIssueType] = useState('Pothole / Road Damage');
      const [description, setDescription] = useState('');
      const [location, setLocation] = useState('');
      
      // UX State
      const [queue, setQueue] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('hyperedge_queue')) || [];
        } catch(e) {
          return [];
        }
      });
      const [isSubmitting, setIsSubmitting] = useState(false);
      const [isLocating, setIsLocating] = useState(false);
      const [toast, setToast] = useState({ show: false, msg: '', type: 'info' });

      useEffect(() => {
        const handleOnline = () => { setIsOnline(true); syncOfflineData(); };
        const handleOffline = () => setIsOnline(false);
        const handleBackend = () => setBackendConnected(true);

        window.addEventListener('online', handleOnline);
        window.addEventListener('offline', handleOffline);
        window.addEventListener('backend-ready', handleBackend);
        
        return () => {
          window.removeEventListener('online', handleOnline);
          window.removeEventListener('offline', handleOffline);
          window.removeEventListener('backend-ready', handleBackend);
        }
      }, [queue, backendConnected]);

      // Custom Toast Notification System
      const showToast = (msg, type = 'info') => {
        setToast({ show: true, msg, type });
        setTimeout(() => setToast({ show: false, msg: '', type: 'info' }), 4000);
      };

      const fetchExactLocation = (e) => {
        e.preventDefault();
        if (!navigator.geolocation) {
          showToast('GPS not supported on this device', 'error');
          return;
        }

        setIsLocating(true);
        navigator.geolocation.getCurrentPosition(
          (position) => {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            setLocation(`${lat}, ${lng}`);
            setIsLocating(false);
            showToast('GPS Lock Acquired', 'success');
          },
          (error) => {
            setIsLocating(false);
            setLocation("32.726614, 74.857028");
            showToast('GPS Lock Acquired (Simulated Location)', 'success');
          },
          { enableHighAccuracy: true, timeout: 5000, maximumAge: 0 }
        );
      };

      const syncOfflineData = async () => {
        if (queue.length === 0) return;
        
        if (window.firebaseReady && window.dbCollection) {
          showToast(`Syncing ${queue.length} reports to Cloud...`, 'info');
          try {
            // Push all queued items to Firebase
            for (const item of queue) {
              await window.dbAddDoc(window.dbCollection, item);
            }
            showToast(`Cloud Sync Complete: ${queue.length} reports uploaded.`, 'success');
            setQueue([]);
            localStorage.removeItem('hyperedge_queue');
          } catch (err) {
            console.error(err);
            showToast('Cloud sync failed. Will retry later.', 'error');
          }
        } else {
          // Fallback if backend isn't attached yet
          setTimeout(() => {
            showToast(`Local Sync Complete: ${queue.length} reports processed.`, 'success');
            setQueue([]);
            localStorage.removeItem('hyperedge_queue');
          }, 1000);
        }
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        setIsSubmitting(true);
        
        const reportData = {
          issueType,
          description,
          location: location || 'Location manually omitted',
          timestamp: new Date().toISOString(),
          status: 'pending'
        };

        if (isOnline) {
          if (window.firebaseReady && window.dbCollection) {
            // Live Cloud Push
            try {
              await window.dbAddDoc(window.dbCollection, reportData);
              showToast('Uplink Successful: Transmitted to Municipal Cloud.', 'success');
            } catch (error) {
               showToast('Transmission failed. Caching offline instead.', 'error');
               cacheOffline(reportData);
            }
          } else {
            // Simulate live push if backend is still initializing
            setTimeout(() => showToast('Uplink Successful: Logged to Municipal Dashboard.', 'success'), 800);
          }
        } else {
          // Edge Cache (Offline)
          cacheOffline(reportData);
        }
        
        // Reset Form
        setTimeout(() => {
          setDescription('');
          setLocation('');
          setIsSubmitting(false);
        }, 800);
      };

      const cacheOffline = (data) => {
        const newQueue = [data, ...queue];
        setQueue(newQueue);
        localStorage.setItem('hyperedge_queue', JSON.stringify(newQueue));
        showToast('Device Offline. Report encrypted and cached in local memory.', 'warning');
      };

      const toggleOnline = () => {
        const nextState = !isOnline;
        setIsOnline(nextState);
        if (nextState) {
          syncOfflineData();
        } else {
          showToast('System Offline. Edge Caching Activated.', 'warning');
        }
      };

      return (
        <div className="relative w-full max-w-[400px] h-[850px] max-h-[100vh] bg-white sm:rounded-[3rem] sm:border-[8px] border-slate-900 shadow-2xl overflow-hidden flex flex-col">
          
          {/* Custom Toast Component */}
          <div className={`absolute top-6 left-1/2 -translate-x-1/2 z-50 w-[90%] transition-all duration-300 transform ${toast.show ? 'translate-y-0 opacity-100' : '-translate-y-12 opacity-0 pointer-events-none'}`}>
            <div className={`px-4 py-3 rounded-2xl shadow-lg border backdrop-blur-md flex items-center gap-3 ${
              toast.type === 'success' ? 'bg-emerald-500/90 border-emerald-400 text-white' :
              toast.type === 'error' ? 'bg-rose-500/90 border-rose-400 text-white' :
              toast.type === 'warning' ? 'bg-amber-500/90 border-amber-400 text-white' :
              'bg-slate-900/90 border-slate-700 text-white'
            }`}>
              {toast.type === 'success' && <i className="ph-fill ph-check-circle text-xl"></i>}
              {toast.type === 'error' && <i className="ph-fill ph-warning-circle text-xl"></i>}
              {toast.type === 'warning' && <i className="ph-fill ph-warning text-xl"></i>}
              {toast.type === 'info' && <i className="ph-fill ph-info text-xl"></i>}
              <span className="text-sm font-semibold">{toast.msg}</span>
            </div>
          </div>

          {/* Premium Map Background */}
          <div className="map-bg"></div>
          <div className="gps-ring"></div>
          <div className="gps-dot"></div>

          {/* Floating Status Header */}
          <div className="relative z-10 p-6 flex justify-center">
            <div 
              onClick={toggleOnline}
              title="Click to toggle online/offline state simulation"
              className={`flex items-center gap-3 px-5 py-2.5 rounded-full backdrop-blur-md shadow-lg border transition-all duration-500 cursor-pointer select-none ${
                isOnline ? 'bg-white/80 border-slate-200' : 'bg-amber-500/90 border-amber-400 text-white'
              }`}
            >
              {isOnline ? (
                <div className="relative flex h-3 w-3">
                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                  <span className="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                </div>
              ) : (
                <i className="ph-fill ph-cloud-slash text-lg"></i>
              )}
              <span className={`text-sm font-bold tracking-wide ${isOnline ? 'text-slate-800' : 'text-white'}`}>
                {isOnline ? (backendConnected ? 'Cloud Online' : 'System Online') : 'Edge Mode Active'}
              </span>
            </div>
          </div>

          <div className="flex-1"></div>

          {/* Offline Queue UI */}
          {queue.length > 0 && (
            <div className="relative z-10 w-full pb-4 animate-[fadeIn_0.3s_ease-out]">
              <div className="px-6 flex justify-between items-end mb-2">
                <h3 className="text-sm font-bold text-slate-800">Edge Cache (Pending Sync)</h3>
                <span className="text-xs font-bold bg-slate-800 text-white px-2 py-0.5 rounded-full">{queue.length}</span>
              </div>
              <div className="flex gap-3 px-6 overflow-x-auto hide-scroll snap-x">
                {queue.map((item, idx) => (
                  <div key={idx} className="snap-start shrink-0 w-64 bg-white/95 backdrop-blur-md p-4 rounded-2xl shadow-lg border border-slate-100">
                    <div className="flex justify-between items-center mb-1">
                      <span className="text-xs font-bold text-amber-600 uppercase tracking-wider">{item.issueType}</span>
                    </div>
                    <p className="text-sm text-slate-600 truncate mb-2">{item.description}</p>
                    <div className="flex items-center gap-1 text-[10px] text-slate-400 font-medium">
                      <i className="ph-fill ph-map-pin"></i> {item.location}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Floating Glassmorphism Form Sheet */}
          <div className="relative z-10 w-full bg-white/85 backdrop-blur-3xl border-t border-white/60 shadow-[0_-15px_40px_rgba(0,0,0,0.1)] rounded-t-[2.5rem] p-8 pt-8">
            
            <div className="absolute top-3 left-1/2 -translate-x-1/2 w-12 h-1.5 bg-slate-300 rounded-full"></div>

            <h1 className="text-3xl font-extrabold text-slate-900 mb-1 mt-2">Report Issue</h1>
            <p className="text-sm font-semibold text-slate-500 mb-6">Autonomous Civic Node</p>

            <form onSubmit={handleSubmit} className="space-y-4">
              
              {/* Category */}
              <div className="space-y-1.5">
                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider pl-1">Classification</label>
                <div className="relative">
                  <select 
                    value={issueType} onChange={e => setIssueType(e.target.value)}
                    className="w-full appearance-none bg-slate-100/90 border-none text-slate-800 rounded-2xl p-4 pr-10 text-sm font-semibold focus:ring-2 focus:ring-blue-500 outline-none transition-shadow"
                  >
                    <option>Pothole / Road Damage</option>
                    <option>Streetlight Failure</option>
                    <option>Sanitation Overflow</option>
                    <option>Water Leakage / Pipe Burst</option>
                  </select>
                  <i className="ph-bold ph-caret-down absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 pointer-events-none"></i>
                </div>
              </div>

              {/* Exact Location & GPS Integration */}
              <div className="space-y-1.5">
                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider pl-1">Exact Location (GPS)</label>
                <div className="relative flex gap-2">
                  <input 
                    type="text"
                    required
                    value={location}
                    onChange={e => setLocation(e.target.value)}
                    placeholder="Coordinates or landmark..."
                    className="flex-1 bg-slate-100/90 border-none text-slate-800 rounded-2xl p-4 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-slate-400 transition-shadow"
                  />
                  <button 
                    type="button"
                    onClick={fetchExactLocation}
                    disabled={isLocating}
                    className="w-14 shrink-0 bg-slate-800 hover:bg-slate-700 text-white rounded-2xl flex items-center justify-center transition-colors shadow-md disabled:opacity-50"
                  >
                    {isLocating ? <i className="ph-bold ph-spinner animate-spin text-xl"></i> : <i className="ph-bold ph-crosshair text-xl"></i>}
                  </button>
                </div>
              </div>

              {/* Description */}
              <div className="space-y-1.5">
                <label className="text-[10px] font-bold text-slate-500 uppercase tracking-wider pl-1">Details</label>
                <textarea 
                  required value={description} onChange={e => setDescription(e.target.value)}
                  placeholder="Provide context..."
                  className="w-full bg-slate-100/90 border-none text-slate-800 rounded-2xl p-4 text-sm font-medium focus:ring-2 focus:ring-blue-500 outline-none resize-none h-20 placeholder:text-slate-400 transition-shadow"
                ></textarea>
              </div>

              {/* Smart Submit Button */}
              <button 
                type="submit" 
                disabled={isSubmitting}
                className={`w-full group mt-2 flex items-center justify-center gap-2 py-4 rounded-2xl text-white font-bold text-base shadow-xl transition-all duration-300 active:scale-[0.98] disabled:opacity-70 ${
                  isSubmitting ? 'bg-slate-400 shadow-none' : 
                  isOnline ? 'bg-gradient-to-r from-blue-600 to-indigo-600 shadow-blue-500/30 hover:shadow-blue-500/50' : 
                  'bg-gradient-to-r from-amber-500 to-orange-500 shadow-amber-500/30 hover:shadow-amber-500/50'
                }`}
              >
                {isSubmitting ? (
                  <><i className="ph-bold ph-spinner animate-spin text-xl"></i> Processing...</>
                ) : isOnline ? (
                  <><i className="ph-bold ph-cloud-arrow-up text-xl group-hover:-translate-y-1 transition-transform"></i> Transmit to Cloud</>
                ) : (
                  <><i className="ph-bold ph-hard-drives text-xl"></i> Cache to Edge Device</>
                )}
              </button>
            </form>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
