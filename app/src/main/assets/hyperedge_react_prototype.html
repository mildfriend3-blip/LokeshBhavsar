<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF6EE" />
  <title>HyperEdge | Ward 12</title>
  
  <!-- Space Grotesk, Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@700&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            creamBg: '#FAF6EE',
            mapDarkCream: '#F1EBDD',
            navyBrand: '#0F2B46',
            orangeBrand: '#E8760C',
            redBrand: '#BE3A2B',
            greenBrand: '#1F9D55',
            slateInactive: '#5B6B7A'
          },
          fontFamily: {
            heading: ['Space Grotesk', 'sans-serif'],
            body: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      box-sizing: border-box;
      user-select: none;
    }
    body {
      background-color: #EAE5D9;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState } = React;

    function App() {
      // 4 Tabs: 'home' | 'report' | 'drafts' | 'profile'
      const [currentTab, setCurrentTab] = useState('home');
      const [isOnline, setIsOnline] = useState(false);
      const [selectedChip, setSelectedChip] = useState("Sadak");
      const [toastMsg, setToastMsg] = useState(null);

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 2500);
      };

      return (
        <div className="w-full max-w-[390px] h-[100dvh] bg-creamBg shadow-2xl flex flex-col relative overflow-hidden text-navyBrand sm:rounded-[36px] sm:h-[844px] sm:border-[8px] sm:border-navyBrand font-body">
          
          {/* 1. HEADER: Cream #FAF6EE background (single row, 16px padding, 1pt navy border-bottom) */}
          <header className="bg-creamBg border-b border-navyBrand px-4 py-3 flex items-center justify-between z-20 shrink-0">
            {/* Left: "HyperEdge" (Space Grotesk 800, 22px, navy #0F2B46) */}
            <h1 className="font-heading font-extrabold text-[22px] tracking-tight text-navyBrand leading-none">
              HyperEdge
            </h1>

            {/* Right: 2 Badges: OFFLINE (red text, 1pt border, transparent bg) & 2/8 Sync (orange bg, white text, Mono 700) */}
            <div className="flex items-center gap-2">
              <button
                onClick={() => setIsOnline(!isOnline)}
                className={`px-2 py-0.5 rounded text-[11px] font-mono font-bold border transition-colors ${
                  isOnline 
                    ? 'text-greenBrand border-greenBrand bg-transparent' 
                    : 'text-redBrand border-redBrand bg-transparent'
                }`}
                title="Toggle signal"
              >
                {isOnline ? "ONLINE" : "OFFLINE"}
              </button>

              <div className="bg-orangeBrand text-white text-[11px] font-mono font-bold px-2 py-0.5 rounded">
                2/8 Sync
              </div>
            </div>
          </header>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-navyBrand text-white px-3.5 py-2.5 rounded shadow-lg flex items-center gap-2 text-xs font-medium border border-navyBrand animate-fade-in">
              <span>{toastMsg}</span>
            </div>
          )}

          {/* SCROLLABLE BODY */}
          <main className="flex-1 overflow-y-auto no-scrollbar pb-24">

            {/* ========================================== */}
            {/* SCREEN 1: DASHBOARD (HOME)                 */}
            {/* ========================================== */}
            {currentTab === 'home' && (
              <div className="pt-3.5 space-y-4">
                
                {/* 2. MAP: Bundled inline SVG map (Height: ~45% viewport / 240px, 1pt navy border, 4px radius, 16px margin) */}
                <div className="mx-4 h-[240px] rounded bg-mapDarkCream border border-navyBrand relative overflow-hidden select-none">
                  
                  {/* Inline Vector Map */}
                  <svg className="w-full h-full" viewBox="0 0 358 240" fill="none" xmlns="http://www.w3.org/2000/svg">
                    {/* Background Texture Blocks */}
                    <rect width="358" height="240" fill="#F1EBDD"/>
                    <path d="M40 70 L140 50 L160 110 L50 120 Z" fill="#E8E0D0" opacity="0.6"/>
                    <path d="M180 80 L320 60 L310 160 L190 140 Z" fill="#E8E0D0" opacity="0.6"/>
                    <path d="M70 140 L160 130 L150 210 L60 210 Z" fill="#E8E0D0" opacity="0.5"/>

                    {/* Tawi River wavy line */}
                    <path 
                      d="M0 45 C70 30, 140 65, 230 40 C280 28, 320 50, 358 42" 
                      stroke="#6B92A8" 
                      strokeWidth="5" 
                      strokeLinecap="round" 
                      fill="none"
                    />

                    {/* 5-6 Irregular Roads */}
                    {/* Bahu Plaza Road (South diagonal) */}
                    <path d="M20 205 L150 150 L340 170" stroke="#C7BBA4" strokeWidth="4.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
                    
                    {/* Sector 3 Main Spine */}
                    <path d="M150 150 L135 75 L215 60" stroke="#D4C8B2" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round" fill="none"/>
                    
                    {/* Canal Link Road */}
                    <path d="M50 95 L135 75" stroke="#D4C8B2" strokeWidth="3" strokeLinecap="round" fill="none"/>
                    
                    {/* East Ward Corridor */}
                    <path d="M215 60 L300 110 L270 170" stroke="#D4C8B2" strokeWidth="3.5" strokeLinecap="round" fill="none"/>
                    
                    {/* Market Enclave loop */}
                    <path d="M70 180 L95 130 L150 150" stroke="#C7BBA4" strokeWidth="3" strokeLinecap="round" fill="none"/>
                    
                    {/* Secondary alley */}
                    <path d="M210 115 L260 140" stroke="#DDD2BD" strokeWidth="2.5" strokeLinecap="round" fill="none"/>

                    {/* Road Annotations */}
                    <text x="18" y="32" fill="#4A748C" fontSize="10" fontFamily="JetBrains Mono" fontWeight="bold">Tawi River</text>
                    <text x="120" y="105" fill="#0F2B46" fontSize="13" fontFamily="Space Grotesk" fontWeight="800">Trikuta Nagar</text>
                    <text x="235" y="195" fill="#706351" fontSize="10" fontFamily="Inter" fontWeight="600">Bahu Plaza road</text>

                    {/* 4 PINS (Orange = Pending, Green = Synced) */}
                    {/* Pin 1: Bahu Plaza road (Orange Pending) */}
                    <circle cx="120" cy="162" r="7" fill="#E8760C" stroke="#FAF6EE" strokeWidth="1.5"/>
                    <circle cx="120" cy="162" r="12" fill="#E8760C" opacity="0.2"/>

                    {/* Pin 2: Sector 3 Canal curve (Orange Pending) */}
                    <circle cx="75" cy="90" r="7" fill="#E8760C" stroke="#FAF6EE" strokeWidth="1.5"/>
                    <circle cx="75" cy="90" r="12" fill="#E8760C" opacity="0.2"/>

                    {/* Pin 3: Trikuta Central Hub (Green Synced) */}
                    <circle cx="175" cy="70" r="7" fill="#1F9D55" stroke="#FAF6EE" strokeWidth="1.5"/>
                    <circle cx="175" cy="70" r="12" fill="#1F9D55" opacity="0.2"/>

                    {/* Pin 4: East Corridor Near Ring (Green Synced) */}
                    <circle cx="285" cy="115" r="7" fill="#1F9D55" stroke="#FAF6EE" strokeWidth="1.5"/>
                    <circle cx="285" cy="115" r="12" fill="#1F9D55" opacity="0.2"/>
                  </svg>

                  {/* Tiny Map Legend Pill */}
                  <div className="absolute bottom-2 left-2 bg-creamBg/90 border border-navyBrand/30 rounded px-2 py-1 flex items-center gap-2.5 text-[9px] font-medium text-navyBrand">
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-orangeBrand"></span>Pending</span>
                    <span className="flex items-center gap-1"><span className="w-2 h-2 rounded-full bg-greenBrand"></span>Synced</span>
                  </div>
                </div>

                {/* 3. MAP KE NEECHE: "Ward 12 · Trikuta Nagar" heading */}
                <div className="px-4 space-y-3">
                  <h2 className="font-heading font-extrabold text-[18px] text-navyBrand tracking-tight">
                    Ward 12 · Trikuta Nagar
                  </h2>

                  {/* Summary Card: "4 Incidents Queued · 0 KB Synced" */}
                  <div className="bg-white border border-navyBrand rounded p-3 shadow-xs flex items-center justify-between text-xs">
                    <div className="flex items-center gap-1">
                      <span className="font-mono font-bold text-sm text-orangeBrand">4</span>
                      <span className="font-semibold text-navyBrand">Incidents Queued</span>
                    </div>
                    <span className="text-slateInactive">·</span>
                    <div className="flex items-center gap-1">
                      <span className="font-mono font-bold text-sm text-navyBrand">0 KB</span>
                      <span className="font-semibold text-navyBrand">Synced</span>
                    </div>
                  </div>

                  {/* 2 Report Cards */}
                  {/* Card 1: RK, "Gadda near Bahu Plaza road", "24 Sep, 14:32:07", "SEALED" (green) */}
                  <div className="bg-white border border-navyBrand rounded p-3 shadow-xs flex items-center justify-between">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-9 h-9 rounded-full bg-navyBrand text-creamBg font-bold text-xs flex items-center justify-center shrink-0">
                        RK
                      </div>
                      <div className="min-w-0">
                        <h3 className="text-xs font-bold text-navyBrand truncate">Gadda near Bahu Plaza road</h3>
                        <p className="text-[11px] font-mono text-slateInactive mt-0.5">24 Sep, 14:32:07</p>
                      </div>
                    </div>

                    <div className="border border-greenBrand text-greenBrand rounded px-2 py-0.5 text-[10px] font-mono font-bold shrink-0 ml-2">
                      SEALED
                    </div>
                  </div>

                  {/* Card 2: SD, "Kachra overflow Sec 4 market", "24 Sep, 14:18:42", "PENDING" (orange) */}
                  <div className="bg-white border border-navyBrand rounded p-3 shadow-xs flex items-center justify-between">
                    <div className="flex items-center gap-2.5 min-w-0">
                      <div className="w-9 h-9 rounded-full bg-orangeBrand text-white font-bold text-xs flex items-center justify-center shrink-0">
                        SD
                      </div>
                      <div className="min-w-0">
                        <h3 className="text-xs font-bold text-navyBrand truncate">Kachra overflow Sec 4 market</h3>
                        <p className="text-[11px] font-mono text-slateInactive mt-0.5">24 Sep, 14:18:42</p>
                      </div>
                    </div>

                    <div className="border border-orangeBrand text-orangeBrand rounded px-2 py-0.5 text-[10px] font-mono font-bold shrink-0 ml-2">
                      PENDING
                    </div>
                  </div>
                </div>

                {/* NOTE: "Report Issue" big button is completely DELETED from Dashboard */}
              </div>
            )}

            {/* SCREEN 2: REPORT ISSUE (Untouched functionality, accessible via FAB) */}
            {currentTab === 'report' && (
              <div className="p-4 space-y-4">
                <div className="flex items-center gap-2 pb-2 border-b border-navyBrand/20">
                  <button onClick={() => setCurrentTab('home')} className="text-navyBrand font-bold text-sm">
                    ← Back
                  </button>
                  <h2 className="font-heading font-extrabold text-lg text-navyBrand">Report Issue</h2>
                </div>

                <div className="w-full h-[260px] bg-black rounded relative overflow-hidden flex flex-col justify-end">
                  <img src="https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=800&auto=format&fit=crop&q=80" alt="Camera view" className="absolute inset-0 w-full h-full object-cover opacity-75"/>
                  <div className="relative z-10 bg-black/65 px-3 py-2 text-white text-xs font-mono">
                    Edge AI Active: Pothole Detected (94%)
                  </div>
                </div>

                <div className="flex gap-2">
                  {["Sadak", "Kachra", "Bijli"].map(chip => (
                    <button
                      key={chip}
                      onClick={() => setSelectedChip(chip)}
                      className={`px-3 py-1 rounded text-xs font-bold border transition-colors ${
                        selectedChip === chip ? 'bg-orangeBrand text-white border-orangeBrand' : 'bg-white text-navyBrand border-navyBrand/30'
                      }`}
                    >
                      {chip}
                    </button>
                  ))}
                </div>

                <button
                  onClick={() => {
                    showToast("✓ Saved to Offline Vault (ChaCha20)");
                    setCurrentTab('drafts');
                  }}
                  className="w-full py-3 bg-orangeBrand text-white font-bold rounded text-xs active:scale-[0.99] transition-all"
                >
                  Save to Offline Vault (ChaCha20)
                </button>
              </div>
            )}

            {/* SCREEN 3: DRAFTS (Sync Vault content mapped to Drafts) */}
            {currentTab === 'drafts' && (
              <div className="p-4 space-y-3">
                <h2 className="font-heading font-extrabold text-lg text-navyBrand">Drafts & Vault</h2>
                <div className="bg-white border border-navyBrand rounded p-3 flex justify-between items-center text-xs">
                  <span className="font-semibold text-navyBrand">4 Pending Incidents</span>
                  <button onClick={() => showToast("Syncing delta packets...")} className="px-3 py-1 bg-navyBrand text-white rounded text-xs font-bold">
                    Sync Now
                  </button>
                </div>

                <div className="space-y-2">
                  <div className="bg-white border border-navyBrand rounded p-3">
                    <h3 className="text-xs font-bold text-navyBrand">Ticket #HYE-0042</h3>
                    <p className="text-[11px] text-slateInactive">Category: Sadak | Size: 2.4MB</p>
                    <span className="text-[10px] text-orangeBrand font-mono block mt-1">🔒 Encrypted locally</span>
                  </div>
                  <div className="bg-white border border-navyBrand rounded p-3">
                    <h3 className="text-xs font-bold text-navyBrand">Ticket #HYE-0043</h3>
                    <p className="text-[11px] text-slateInactive">Category: Kachra | Size: 1.8MB</p>
                    <span className="text-[10px] text-orangeBrand font-mono block mt-1">🔒 Encrypted locally</span>
                  </div>
                </div>
              </div>
            )}

            {/* SCREEN 4: PROFILE */}
            {currentTab === 'profile' && (
              <div className="p-4 space-y-3">
                <h2 className="font-heading font-extrabold text-lg text-navyBrand">Officer Profile</h2>
                <div className="bg-white border border-navyBrand rounded p-3 space-y-1 text-xs">
                  <div className="font-bold text-navyBrand">Field Officer #042</div>
                  <div className="text-slateInactive">Ward 12 · Trikuta Nagar</div>
                  <div className="font-mono text-orangeBrand text-[10px]">Node: JMC-CORRIDOR-042</div>
                </div>
              </div>
            )}

          </main>

          {/* 5. BOTTOM NAV: Full width (left:0 right:0), height 64px, cream bg, 1pt navy border-top */}
          {/* 4 tabs: Home, Report (center FAB), Drafts (badge 4), Profile */}
          <nav className="absolute bottom-0 left-0 right-0 h-[64px] bg-creamBg border-t border-navyBrand z-30 flex items-center justify-around px-2">
            
            {/* Tab 1: Home */}
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-0.5 w-16 transition-colors ${
                currentTab === 'home' ? 'text-orangeBrand' : 'text-slateInactive'
              }`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span className="text-[11px] font-medium leading-none">Home</span>
            </button>

            {/* Tab 2: Center FAB: 56px orange #E8760C circle, protruding only 16px above nav, with 4px cream ring */}
            <div className="relative -top-4 flex flex-col items-center">
              <button
                onClick={() => setCurrentTab('report')}
                className="w-14 h-14 rounded-full bg-orangeBrand ring-4 ring-creamBg flex items-center justify-center text-white shadow-md active:scale-95 transition-transform"
                title="Report"
              >
                <svg className="w-7 h-7" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 4v16m8-8H4" />
                </svg>
              </button>
              <span className={`text-[11px] font-medium mt-0.5 leading-none ${currentTab === 'report' ? 'text-orangeBrand' : 'text-slateInactive'}`}>
                Report
              </span>
            </div>

            {/* Tab 3: Drafts (Badge "4") */}
            <button
              onClick={() => setCurrentTab('drafts')}
              className={`flex flex-col items-center gap-0.5 w-16 transition-colors relative ${
                currentTab === 'drafts' ? 'text-orangeBrand' : 'text-slateInactive'
              }`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                {/* Badge "4" */}
                <span className="absolute -top-1 -right-2 w-4 h-4 bg-orangeBrand text-white text-[9px] font-bold rounded-full flex items-center justify-center">
                  4
                </span>
              </div>
              <span className="text-[11px] font-medium leading-none">Drafts</span>
            </button>

            {/* Tab 4: Profile */}
            <button
              onClick={() => setCurrentTab('profile')}
              className={`flex flex-col items-center gap-0.5 w-16 transition-colors ${
                currentTab === 'profile' ? 'text-orangeBrand' : 'text-slateInactive'
              }`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
              <span className="text-[11px] font-medium leading-none">Profile</span>
            </button>

          </nav>

        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
