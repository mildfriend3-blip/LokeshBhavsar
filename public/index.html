<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HyperEdge | Ward 12</title>
  
  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for TSX parsing in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandNavy: '#0F2B46',
            brandOrange: '#E8760C',
            brandGreen: '#1F9D55',
            brandRed: '#BE3A2B',
            appBg: '#F9FAFB'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #F3F4F6;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;

    interface ReportItem {
      id: string;
      title: string;
      category: string;
      location: string;
      timeAgo: string;
      status: 'RESOLVED' | 'IN_PROGRESS' | 'QUEUED' | 'SYNCED';
      imageUrl: string;
      votes: number;
      aiConfidence: number;
      hash?: string;
    }

    const INITIAL_REPORTS: ReportItem[] = [
      {
        id: "HYE-204",
        title: "Deep Pothole with Stagnant Water",
        category: "Sadak (Pothole)",
        location: "Canal Rd, Sec 3, Trikuta Nagar",
        timeAgo: "12m ago",
        status: "QUEUED",
        imageUrl: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=600&auto=format&fit=crop&q=80",
        votes: 18,
        aiConfidence: 94,
        hash: "8F2A-91C8"
      },
      {
        id: "HYE-203",
        title: "Overflowing Municipal Enclosure",
        category: "Kachra (Garbage)",
        location: "Near Sector 4 Market, Trikuta Nagar",
        timeAgo: "45m ago",
        status: "IN_PROGRESS",
        imageUrl: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=600&auto=format&fit=crop&q=80",
        votes: 34,
        aiConfidence: 96,
        hash: "4A7B-89E1"
      },
      {
        id: "HYE-198",
        title: "Underground Potable Water Main Burst",
        category: "Paani (Water)",
        location: "Main Chowk, Channi Himmat",
        timeAgo: "2h ago",
        status: "RESOLVED",
        imageUrl: "https://images.unsplash.com/photo-1584467735815-f778f274e296?w=600&auto=format&fit=crop&q=80",
        votes: 52,
        aiConfidence: 91,
        hash: "7A1C-99B2"
      },
      {
        id: "HYE-195",
        title: "Sodium Vapor Fixtures Out (x3)",
        category: "Bijli (Streetlight)",
        location: "Lane 4, Bakshi Nagar Enclave",
        timeAgo: "4h ago",
        status: "RESOLVED",
        imageUrl: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=80",
        votes: 9,
        aiConfidence: 98,
        hash: "3D4E-7B21"
      }
    ];

    const CATEGORY_CHIPS = [
      { id: "sadak", title: "Sadak (Potholes)", preset: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=800&auto=format&fit=crop&q=80" },
      { id: "kachra", title: "Kachra (Garbage)", preset: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=800&auto=format&fit=crop&q=80" },
      { id: "bijli", title: "Bijli (Streetlights)", preset: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=800&auto=format&fit=crop&q=80" },
      { id: "paani", title: "Paani (Water)", preset: "https://images.unsplash.com/photo-1584467735815-f778f274e296?w=800&auto=format&fit=crop&q=80" },
      { id: "nala", title: "Nala (Drainage)", preset: "https://images.unsplash.com/photo-1584467735815-f778f274e296?w=800&auto=format&fit=crop&q=80" }
    ];

    function MobileApp() {
      // 3 Main Mobile Screens: 'home' | 'report' | 'vault'
      const [currentTab, setCurrentTab] = useState<'home' | 'report' | 'vault'>('home');
      const [isOnline, setIsOnline] = useState(false);
      const [reports, setReports] = useState<ReportItem[]>(INITIAL_REPORTS);
      
      // Form state
      const [selectedChip, setSelectedChip] = useState(CATEGORY_CHIPS[0]);
      const [desc, setDesc] = useState("Deep road cavity causing severe two-wheeler hazard.");
      const [locationInput, setLocationInput] = useState("Canal Road, Sec 3, Trikuta Nagar");
      
      // Sync state
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncProgress, setSyncProgress] = useState(0);
      const [toastMsg, setToastMsg] = useState<string | null>(null);

      const showToast = (msg: string) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const handleSaveReport = () => {
        const newReport: ReportItem = {
          id: `HYE-${Math.floor(205 + Math.random() * 50)}`,
          title: selectedChip.title,
          category: selectedChip.title,
          location: locationInput,
          timeAgo: "Just now",
          status: isOnline ? "SYNCED" : "QUEUED",
          imageUrl: selectedChip.preset,
          votes: 1,
          aiConfidence: 94,
          hash: "9C4D-22E5"
        };
        setReports([newReport, ...reports]);
        showToast("✓ Encrypted & saved to ChaCha20 Offline Vault");
        setCurrentTab('vault');
      };

      const handleSyncNow = () => {
        if (!isOnline) {
          showToast("⚠ No Signal. Switch toggle to Online first!");
          return;
        }
        setIsSyncing(true);
        setSyncProgress(25);
        setTimeout(() => setSyncProgress(65), 500);
        setTimeout(() => setSyncProgress(90), 1000);
        setTimeout(() => {
          setSyncProgress(100);
          setIsSyncing(false);
          setReports(reports.map(r => ({ ...r, status: r.status === 'QUEUED' ? 'SYNCED' : r.status })));
          showToast("✓ All tickets successfully uploaded to JMC Cloud!");
        }, 1500);
      };

      const queuedCount = reports.filter(r => r.status === 'QUEUED').length;

      return (
        <div className="w-full max-w-md h-[100dvh] bg-appBg shadow-2xl flex flex-col relative overflow-hidden text-slate-800 antialiased sm:rounded-[36px] sm:h-[844px] sm:border-[8px] sm:border-slate-800">
          
          {/* APP HEADER: Just the text "HyperEdge | Ward 12" and a clean, elegant [Online/Offline] toggle button. NO OTHER TEXT. */}
          <header className="bg-brandNavy text-white px-5 py-3.5 flex items-center justify-between shadow-sm z-20">
            <span className="text-base font-bold tracking-tight text-white">
              HyperEdge | Ward 12
            </span>

            <button
              onClick={() => setIsOnline(!isOnline)}
              className={`px-3 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all shadow-sm ${
                isOnline 
                  ? 'bg-brandGreen/25 text-green-300 border border-brandGreen/40' 
                  : 'bg-brandRed/25 text-red-300 border border-brandRed/50'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-brandGreen animate-pulse' : 'bg-brandRed'}`}></span>
              <span>{isOnline ? "Online" : "Offline"}</span>
            </button>
          </header>

          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-slate-900 text-white px-4 py-3 rounded-xl shadow-xl flex items-center gap-2 text-xs font-medium border border-slate-700 animate-fade-in">
              <svg className="w-4 h-4 text-brandGreen" fill="currentColor" viewBox="0 0 20 20">
                <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
              </svg>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* SCROLLABLE BODY */}
          <main className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-24">
            
            {/* SCREEN 1: HOME (CITIZEN FEED) */}
            {currentTab === 'home' && (
              <div className="space-y-3">
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 tracking-tight">Recent Reports near you</h2>
                    <p className="text-xs text-slate-500">Ward 12 · Trikuta Nagar & Canal Road</p>
                  </div>
                  <span className="bg-slate-200/80 text-slate-700 text-xs px-2.5 py-1 rounded-full font-semibold">
                    {reports.length} Reports
                  </span>
                </div>

                <div className="space-y-3">
                  {reports.map(item => {
                    const isQueued = item.status === 'QUEUED';
                    const isResolved = item.status === 'RESOLVED';
                    return (
                      <div 
                        key={item.id} 
                        className="bg-white rounded-xl p-4 mb-3 shadow-sm border border-gray-100 flex flex-col space-y-2.5 transition active:scale-[0.99]"
                      >
                        {/* Header: Category & Small Elegant Status Pill (Does NOT color entire card) */}
                        <div className="flex items-center justify-between">
                          <span className="bg-slate-100 text-slate-700 text-[11px] font-semibold px-2.5 py-0.5 rounded-md">
                            {item.category}
                          </span>

                          {isResolved && (
                            <span className="bg-green-100 text-green-800 rounded-full px-2 py-0.5 text-xs font-bold">
                              ✓ Resolved
                            </span>
                          )}
                          {isQueued && (
                            <span className="bg-orange-100 text-orange-800 rounded-full px-2 py-0.5 text-xs font-bold">
                              Queued in Vault
                            </span>
                          )}
                          {item.status === 'IN_PROGRESS' && (
                            <span className="bg-blue-100 text-blue-800 rounded-full px-2 py-0.5 text-xs font-bold">
                              In Progress
                            </span>
                          )}
                          {item.status === 'SYNCED' && (
                            <span className="bg-emerald-100 text-emerald-800 rounded-full px-2 py-0.5 text-xs font-bold">
                              Synced JMC
                            </span>
                          )}
                        </div>

                        {/* Thumbnail & Content */}
                        <div className="flex gap-3 items-center">
                          <img 
                            src={item.imageUrl} 
                            alt={item.title} 
                            className="w-16 h-16 rounded-lg object-cover bg-slate-100 shrink-0" 
                          />
                          <div className="flex-1 min-w-0">
                            <h3 className="text-sm font-bold text-slate-900 leading-snug truncate">{item.title}</h3>
                            <p className="text-xs text-slate-500 mt-0.5 truncate">{item.location}</p>
                            <span className="text-[10px] text-slate-400 font-mono mt-0.5 block">{item.id} · {item.timeAgo}</span>
                          </div>
                        </div>

                        {/* Footer */}
                        <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                          <span>{item.votes} citizens impacted</span>
                          <span className="text-[10px] font-mono text-emerald-700 font-semibold">AI Check: {item.aiConfidence}%</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* SCREEN 2: REPORT ISSUE (EDGE AI) */}
            {currentTab === 'report' && (
              <div className="space-y-4">
                <div>
                  <h2 className="text-lg font-bold text-slate-900 tracking-tight">Report Civic Issue</h2>
                  <p className="text-xs text-slate-500">On-device edge AI signs ticket without internet</p>
                </div>

                {/* Category Chips */}
                <div className="space-y-1.5">
                  <label className="text-xs font-bold text-slate-700 uppercase tracking-wider font-mono">Category</label>
                  <div className="flex gap-2 overflow-x-auto no-scrollbar py-1">
                    {CATEGORY_CHIPS.map(chip => {
                      const isSel = selectedChip.id === chip.id;
                      return (
                        <button
                          key={chip.id}
                          onClick={() => setSelectedChip(chip)}
                          className={`px-3 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition-colors border ${
                            isSel 
                              ? 'bg-brandOrange text-white border-brandOrange' 
                              : 'bg-white text-slate-700 border-slate-200'
                          }`}
                        >
                          {chip.title}
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Simulated Camera Viewfinder Box (Edge AI Validation) */}
                <div className="space-y-1.5">
                  <div className="flex justify-between items-center text-xs font-bold text-slate-700 font-mono">
                    <span>EDGE AI VIEWFINDER</span>
                    <span className="text-green-700 bg-green-100 px-2 py-0.5 rounded-full text-[10px]">TFLite Model Active</span>
                  </div>

                  <div className="relative rounded-2xl overflow-hidden bg-black aspect-[4/3] border border-slate-300 shadow-sm flex flex-col justify-between p-3">
                    <img 
                      src={selectedChip.preset} 
                      alt="Camera preview"
                      className="absolute inset-0 w-full h-full object-cover opacity-85"
                    />

                    {/* Top GPS Overlay */}
                    <div className="relative z-10 flex justify-between items-center text-white text-[10px] font-mono">
                      <span className="bg-black/60 px-2 py-0.5 rounded backdrop-blur-sm">
                        GPS: 32.7058°N, 74.8732°E · Ward 12
                      </span>
                      <span className="bg-brandOrange px-1.5 py-0.5 rounded text-[9px] font-bold">NPU 12ms</span>
                    </div>

                    {/* Center Bounding Box */}
                    <div className="relative z-10 self-center border-2 border-brandOrange rounded-lg p-2 bg-brandOrange/10 shadow-[0_0_12px_rgba(232,118,12,0.5)]">
                      <span className="bg-brandOrange text-white text-[10px] font-bold px-2 py-0.5 rounded shadow block">
                        Pothole Detected - 94%
                      </span>
                    </div>

                    {/* Bottom Telemetry Readout */}
                    <div className="relative z-10 bg-black/75 backdrop-blur-sm p-2 rounded-xl text-white text-[10px] font-mono flex justify-between items-center">
                      <span className="text-brandGreen font-bold">✓ Clarity: 93.8% PASS</span>
                      <span className="text-slate-300">SHA-256: 8F2A-91C8</span>
                    </div>
                  </div>
                </div>

                {/* Input Fields */}
                <div className="space-y-3">
                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Location / Landmark</label>
                    <input 
                      type="text"
                      value={locationInput}
                      onChange={(e) => setLocationInput(e.target.value)}
                      className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2.5 text-xs text-slate-900 focus:outline-none focus:border-brandOrange"
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-700 block mb-1">Issue Details</label>
                    <textarea 
                      rows={2}
                      value={desc}
                      onChange={(e) => setDesc(e.target.value)}
                      className="w-full bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs text-slate-900 focus:outline-none focus:border-brandOrange"
                    />
                  </div>
                </div>

                {/* Prominent Orange Button */}
                <button
                  onClick={handleSaveReport}
                  className="w-full py-3.5 bg-brandOrange hover:bg-orange-600 active:scale-[0.98] text-white font-bold text-sm rounded-xl shadow-md transition-all flex items-center justify-center gap-2"
                >
                  <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  <span>Save to Offline Vault</span>
                </button>
              </div>
            )}

            {/* SCREEN 3: OFFLINE VAULT */}
            {currentTab === 'vault' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between pb-1">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 tracking-tight">Offline Vault</h2>
                    <p className="text-xs text-slate-500">ChaCha20 Encrypted On-Device Buffer</p>
                  </div>
                  <span className="bg-orange-100 text-orange-800 font-bold text-xs px-2.5 py-1 rounded-full">
                    {queuedCount} Pending Sync
                  </span>
                </div>

                {/* Sync Controller Card */}
                <div className="bg-white rounded-xl border border-gray-100 p-4 shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">
                        {isOnline ? "4G JMC Link Available" : "Dead-Zone Mode Active"}
                      </h3>
                      <p className="text-[11px] text-slate-500">
                        {isOnline ? "Ready to push delta packets to central command" : "Buffered securely in on-device SQLite ledger"}
                      </p>
                    </div>
                    <span className={`w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-brandGreen animate-pulse' : 'bg-brandRed'}`}></span>
                  </div>

                  {/* Progress bar when syncing */}
                  {isSyncing && (
                    <div className="space-y-1 pt-1">
                      <div className="flex justify-between text-[10px] font-mono text-slate-500">
                        <span>Uploading delta batch...</span>
                        <span>{syncProgress}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div className="bg-brandGreen h-full transition-all duration-300 rounded-full" style={{ width: `${syncProgress}%` }}></div>
                      </div>
                    </div>
                  )}

                  {/* Clean Sync Now Button when Online */}
                  {isOnline ? (
                    <button
                      onClick={handleSyncNow}
                      disabled={isSyncing || queuedCount === 0}
                      className={`w-full py-2.5 px-4 rounded-xl font-bold text-xs transition-all flex items-center justify-center gap-2 ${
                        queuedCount === 0 
                          ? 'bg-slate-100 text-slate-400 cursor-not-allowed' 
                          : 'bg-brandGreen hover:bg-emerald-700 text-white shadow-sm'
                      }`}
                    >
                      {isSyncing ? "Syncing..." : queuedCount === 0 ? "✓ All Records Synced" : `Sync Now (${queuedCount} Tickets)`}
                    </button>
                  ) : (
                    <div className="bg-red-50 text-red-800 text-xs px-3 py-2 rounded-lg flex items-center gap-2 font-medium">
                      <span>Toggle header to 'Online' to trigger central delta-sync.</span>
                    </div>
                  )}
                </div>

                {/* List of Tickets Waiting for Sync */}
                <div className="space-y-2.5">
                  <h3 className="text-xs font-bold text-slate-500 uppercase tracking-wider font-mono">
                    Queued Tickets (ChaCha20 Encrypted)
                  </h3>

                  {reports.map(ticket => {
                    const isQueued = ticket.status === 'QUEUED';
                    return (
                      <div 
                        key={ticket.id} 
                        className="bg-white rounded-xl p-3.5 shadow-sm border border-gray-100 flex items-center justify-between gap-3"
                      >
                        <div className="min-w-0">
                          <div className="flex items-center gap-2">
                            <span className="font-mono text-xs font-bold text-slate-900">{ticket.id}</span>
                            <span className="text-xs text-slate-700 font-medium truncate">· {ticket.category}</span>
                          </div>
                          <p className="text-xs text-slate-500 truncate mt-0.5">{ticket.location}</p>
                          <span className="text-[10px] font-mono text-slate-400 mt-0.5 block">
                            SHA: {ticket.hash || "8F2A-91C8"} · 48 KB
                          </span>
                        </div>

                        <div className="shrink-0 text-right">
                          {isQueued ? (
                            <span className="bg-orange-100 text-orange-800 rounded-full px-2.5 py-0.5 text-[10px] font-bold">
                              Waiting
                            </span>
                          ) : (
                            <span className="bg-green-100 text-green-800 rounded-full px-2.5 py-0.5 text-[10px] font-bold">
                              ✓ Synced
                            </span>
                          )}
                          <span className="text-[10px] font-mono text-slate-400 block mt-1">{ticket.timeAgo}</span>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* 3. FIXED BOTTOM NAVIGATION BAR */}
          <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-6 py-2 flex items-center justify-between z-30 shadow-lg">
            
            {/* Tab 1: Home */}
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-1 transition-colors ${
                currentTab === 'home' ? 'text-brandOrange' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={currentTab === 'home' ? "2.5" : "2"} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span className="text-[10px] font-semibold">Home</span>
            </button>

            {/* Tab 2: Report Issue (FAB in center) */}
            <button
              onClick={() => setCurrentTab('report')}
              className="flex flex-col items-center -mt-5 group"
            >
              <div className={`w-13 h-13 p-3 rounded-full bg-brandOrange text-white shadow-lg transition-transform active:scale-95 group-hover:bg-orange-600 border-4 border-appBg flex items-center justify-center ${
                currentTab === 'report' ? 'ring-2 ring-brandOrange/50' : ''
              }`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M12 4v16m8-8H4" />
                </svg>
              </div>
              <span className="text-[10px] font-bold text-slate-700 mt-1">Report</span>
            </button>

            {/* Tab 3: My Vault */}
            <button
              onClick={() => setCurrentTab('vault')}
              className={`flex flex-col items-center gap-1 relative transition-colors ${
                currentTab === 'vault' ? 'text-brandOrange' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={currentTab === 'vault' ? "2.5" : "2"} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                </svg>
                {queuedCount > 0 && (
                  <span className="absolute -top-1.5 -right-2 bg-brandOrange text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow-xs">
                    {queuedCount}
                  </span>
                )}
              </div>
              <span className="text-[10px] font-semibold">My Vault</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<MobileApp />, document.getElementById('root'));
  </script>
</body>
</html>
