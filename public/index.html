<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>HyperEdge | Jammu Smart City</title>
  
  <!-- Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React 18 & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel for TSX parsing in browser -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brandNavy: '#0F2B46',
            brandNavyDark: '#081A2C',
            brandOrange: '#E8760C',
            brandGreen: '#1F9D55',
            brandRed: '#BE3A2B',
            appBg: '#F9FAFB',
            surface: '#FFFFFF'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
          }
        }
      }
    }
  </script>
  <style>
    * {
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    body {
      background-color: #0b1723;
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    /* Hide scrollbar for clean mobile feel */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="flex items-center justify-center min-h-screen p-0 sm:p-4">
  <div id="root" class="w-full flex justify-center"></div>

  <script type="text/babel" data-presets="react,typescript">
    const { useState, useEffect } = React;

    interface ReportItem {
      id: string;
      title: string;
      category: string;
      location: string;
      timeAgo: string;
      status: 'RESOLVED' | 'IN_PROGRESS' | 'QUEUED' | 'SYNCED';
      imageUrl: string;
      votes: number;
      aiConfidence: number;
      hash?: string;
    }

    const INITIAL_REPORTS: ReportItem[] = [
      {
        id: "HYE-204",
        title: "Deep Pothole with Rainwater Pool",
        category: "Road & Pothole",
        location: "Canal Rd, Sec 3, Trikuta Nagar",
        timeAgo: "12m ago",
        status: "QUEUED",
        imageUrl: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=600&auto=format&fit=crop&q=80",
        votes: 18,
        aiConfidence: 94,
        hash: "8F2A-91C8"
      },
      {
        id: "HYE-203",
        title: "Overflowing Municipal Dumpster",
        category: "Sanitation",
        location: "Near Sector 4 Market, Trikuta Nagar",
        timeAgo: "45m ago",
        status: "IN_PROGRESS",
        imageUrl: "https://images.unsplash.com/photo-1532996122724-e3c354a0b15b?w=600&auto=format&fit=crop&q=80",
        votes: 34,
        aiConfidence: 96,
        hash: "4A7B-89E1"
      },
      {
        id: "HYE-198",
        title: "Underground Water Main Leak",
        category: "Water Supply",
        location: "Main Chowk, Channi Himmat",
        timeAgo: "2h ago",
        status: "RESOLVED",
        imageUrl: "https://images.unsplash.com/photo-1584467735815-f778f274e296?w=600&auto=format&fit=crop&q=80",
        votes: 52,
        aiConfidence: 91,
        hash: "7A1C-99B2"
      },
      {
        id: "HYE-195",
        title: "Unlit Streetlight Fixtures (x3)",
        category: "Streetlight",
        location: "Lane 4, Bakshi Nagar",
        timeAgo: "4h ago",
        status: "RESOLVED",
        imageUrl: "https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=600&auto=format&fit=crop&q=80",
        votes: 9,
        aiConfidence: 98,
        hash: "3D4E-7B21"
      }
    ];

    function MobileApp() {
      // 3 Main Mobile Screens: 'home' | 'camera' | 'vault'
      const [currentTab, setCurrentTab] = useState<'home' | 'camera' | 'vault'>('home');
      const [isOnline, setIsOnline] = useState(false); // Default offline for demonstration
      const [reports, setReports] = useState<ReportItem[]>(INITIAL_REPORTS);
      
      // Camera states
      const [cameraDetected, setCameraDetected] = useState(false);
      const [cameraScanning, setCameraScanning] = useState(true);
      const [capturedPhoto, setCapturedPhoto] = useState(false);
      
      // Vault sync states
      const [isSyncing, setIsSyncing] = useState(false);
      const [syncProgress, setSyncProgress] = useState(0);
      const [toastMsg, setToastMsg] = useState<string | null>(null);

      const showToast = (msg: string) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3200);
      };

      // Camera scanner simulation
      useEffect(() => {
        if (currentTab === 'camera') {
          setCameraScanning(true);
          setCameraDetected(false);
          setCapturedPhoto(false);
          const t = setTimeout(() => {
            setCameraScanning(false);
            setCameraDetected(true);
          }, 900);
          return () => clearTimeout(t);
        }
      }, [currentTab]);

      const handleSaveReportFromCamera = () => {
        const newReport: ReportItem = {
          id: `HYE-${Math.floor(205 + Math.random() * 50)}`,
          title: "Asphalt Fissure & Road Rut",
          category: "Road & Pothole",
          location: "Sector 4, Trikuta Nagar (Ward 12)",
          timeAgo: "Just now",
          status: isOnline ? "SYNCED" : "QUEUED",
          imageUrl: "https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=600&auto=format&fit=crop&q=80",
          votes: 1,
          aiConfidence: 94,
          hash: "9C4D-22E5"
        };
        setReports([newReport, ...reports]);
        showToast("✓ Encrypted & stored in ChaCha20 Offline Vault");
        setCurrentTab('vault');
      };

      const handleSyncVault = () => {
        if (!isOnline) {
          showToast("⚠ No Signal. Switch toggle to 4G Online first!");
          return;
        }
        setIsSyncing(true);
        setSyncProgress(25);

        setTimeout(() => setSyncProgress(60), 600);
        setTimeout(() => setSyncProgress(90), 1200);
        setTimeout(() => {
          setSyncProgress(100);
          setIsSyncing(false);
          setReports(reports.map(r => ({ ...r, status: r.status === 'QUEUED' ? 'SYNCED' : r.status })));
          showToast("✓ All queued reports uploaded to JMC Cloud!");
        }, 1800);
      };

      const queuedCount = reports.filter(r => r.status === 'QUEUED').length;

      return (
        <div className="w-full max-w-md h-[100dvh] bg-appBg shadow-2xl flex flex-col relative overflow-hidden text-slate-800 antialiased sm:rounded-[36px] sm:h-[844px] sm:border-[8px] sm:border-slate-800">
          
          {/* Top Status Bar Simulator (Clock / Battery) */}
          <div className="bg-brandNavy text-white/80 px-6 pt-3 pb-1 flex justify-between items-center text-[11px] font-semibold tracking-tight select-none">
            <span>9:41</span>
            <div className="flex items-center gap-1.5">
              <span className="text-[10px] font-mono">{isOnline ? "4G" : "DEAD-ZONE"}</span>
              <svg className="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                <path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25A9.96 9.96 0 012 12C2 6.48 6.48 2 12 2s10 4.48 10 10c0 2.32-.8 4.45-2.14 6.15l-.62-.62A8.96 8.96 0 0021 12c0-4.97-4.03-9-9-9z"/>
              </svg>
              <div className="w-5 h-2.5 border border-white/60 rounded-sm p-0.5 flex items-center">
                <div className="h-full w-3.5 bg-white rounded-2xs"></div>
              </div>
            </div>
          </div>

          {/* 1. TOP NATIVE APP BAR */}
          <header className="bg-brandNavy text-white px-4 py-3 flex items-center justify-between shadow-md z-20">
            <div className="flex items-center gap-2.5">
              {/* Circular JMC Crest Badge */}
              <div className="w-9 h-9 rounded-full bg-white flex flex-col items-center justify-center border-2 border-brandOrange text-brandNavy font-bold leading-none shadow-sm">
                <span className="text-[10px] tracking-tighter font-extrabold">JMC</span>
                <span className="text-[6px] text-brandOrange -mt-0.5">जम्मू</span>
              </div>
              <div>
                <h1 className="text-base font-bold tracking-tight text-white leading-tight">HyperEdge</h1>
                <p className="text-[10px] text-slate-300 font-medium leading-none">Jammu Smart City · Ward 12</p>
              </div>
            </div>

            {/* Network Toggle Switch Pill */}
            <button
              onClick={() => setIsOnline(!isOnline)}
              className={`px-2.5 py-1 rounded-full text-xs font-semibold flex items-center gap-1.5 transition-all duration-300 shadow-sm border ${
                isOnline 
                  ? 'bg-brandGreen/20 text-green-300 border-brandGreen/40' 
                  : 'bg-brandRed/25 text-red-300 border-brandRed/50'
              }`}
            >
              <span className={`w-2 h-2 rounded-full ${isOnline ? 'bg-brandGreen animate-pulse' : 'bg-brandRed'}`}></span>
              <span className="text-[11px]">{isOnline ? "Online 4G" : "Offline"}</span>
            </button>
          </header>

          {/* Sub-header Connectivity Notice (Only in Dead-Zone) */}
          {!isOnline && (
            <div className="bg-brandRed text-white px-4 py-1.5 text-xs font-medium flex items-center justify-between shadow-inner">
              <span className="flex items-center gap-1.5">
                <svg className="w-3.5 h-3.5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
                <span>Dead-Zone mode: On-device SQLite Active</span>
              </span>
              <span className="text-[10px] opacity-85 underline cursor-pointer" onClick={() => setIsOnline(true)}>Connect</span>
            </div>
          )}

          {/* Toast Notification */}
          {toastMsg && (
            <div className="absolute top-16 left-4 right-4 z-50 bg-slate-900/95 text-white px-4 py-3 rounded-xl shadow-xl flex items-center justify-between text-xs font-medium border border-slate-700 animate-fade-in">
              <div className="flex items-center gap-2">
                <svg className="w-4 h-4 text-brandGreen" fill="currentColor" viewBox="0 0 20 20">
                  <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clipRule="evenodd" />
                </svg>
                <span>{toastMsg}</span>
              </div>
            </div>
          )}

          {/* 2. SCROLLABLE BODY */}
          <main className="flex-1 overflow-y-auto no-scrollbar p-4 space-y-4 pb-24">
            
            {/* SCREEN 1: HOME (CITIZEN FEED) */}
            {currentTab === 'home' && (
              <div className="space-y-4">
                
                {/* Greeting & Filter Chips */}
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 tracking-tight">Ward 12 Feed</h2>
                    <p className="text-xs text-slate-500">Trikuta Nagar & Canal Road</p>
                  </div>
                  <span className="bg-slate-200/80 text-slate-700 text-xs px-2.5 py-1 rounded-full font-semibold">
                    {reports.length} Reports
                  </span>
                </div>

                {/* Quick Offline Alert Card */}
                {!isOnline && (
                  <div className="bg-white rounded-xl p-3.5 border border-slate-200 shadow-sm flex items-start gap-3">
                    <div className="w-8 h-8 rounded-lg bg-orange-100 text-brandOrange flex items-center justify-center shrink-0">
                      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
                      </svg>
                    </div>
                    <div>
                      <h3 className="text-xs font-bold text-slate-900">Zero Internet Required</h3>
                      <p className="text-[11px] text-slate-500 mt-0.5 leading-snug">
                        Reports are signed on-device with ChaCha20 encryption. They upload automatically when you enter coverage.
                      </p>
                    </div>
                  </div>
                )}

                {/* Report Feed Cards */}
                <div className="space-y-3">
                  {reports.map(item => {
                    const isQueued = item.status === 'QUEUED';
                    const isResolved = item.status === 'RESOLVED';
                    return (
                      <div 
                        key={item.id} 
                        className="bg-surface rounded-xl border border-slate-200/80 shadow-sm overflow-hidden flex flex-col transition active:scale-[0.99]"
                      >
                        {/* Card Image Banner */}
                        <div className="h-36 w-full relative bg-slate-100 overflow-hidden">
                          <img 
                            src={item.imageUrl} 
                            alt={item.title} 
                            className="w-full h-full object-cover"
                            loading="lazy"
                          />
                          <div className="absolute top-2.5 left-2.5 bg-slate-900/80 backdrop-blur-sm text-white px-2 py-0.5 rounded-md text-[10px] font-semibold">
                            {item.category}
                          </div>
                          
                          {/* Status Badge */}
                          <div className="absolute top-2.5 right-2.5">
                            {isQueued && (
                              <span className="bg-brandOrange text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm flex items-center gap-1">
                                <span className="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
                                Local Vault (Queued)
                              </span>
                            )}
                            {isResolved && (
                              <span className="bg-brandGreen text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm flex items-center gap-1">
                                ✓ Resolved
                              </span>
                            )}
                            {item.status === 'IN_PROGRESS' && (
                              <span className="bg-blue-600 text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm">
                                Field Team Dispatched
                              </span>
                            )}
                            {item.status === 'SYNCED' && (
                              <span className="bg-emerald-600 text-white px-2 py-0.5 rounded-md text-[10px] font-bold shadow-sm">
                                Synced with JMC
                              </span>
                            )}
                          </div>

                          {/* AI Verification Watermark */}
                          <div className="absolute bottom-2 right-2.5 bg-black/65 text-white text-[9px] px-1.5 py-0.5 rounded font-mono">
                            AI Check: {item.aiConfidence}% Verified
                          </div>
                        </div>

                        {/* Card Content */}
                        <div className="p-3.5 space-y-2">
                          <div>
                            <div className="flex items-center justify-between">
                              <h3 className="text-sm font-bold text-slate-900 leading-snug">{item.title}</h3>
                              <span className="text-[10px] font-mono text-slate-400 font-semibold">{item.id}</span>
                            </div>
                            <div className="flex items-center gap-1 text-[11px] text-slate-500 mt-1">
                              <svg className="w-3.5 h-3.5 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" />
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" />
                              </svg>
                              <span>{item.location}</span>
                              <span>·</span>
                              <span>{item.timeAgo}</span>
                            </div>
                          </div>

                          {/* Footer details */}
                          <div className="pt-2 border-t border-slate-100 flex items-center justify-between text-xs text-slate-500">
                            <div className="flex items-center gap-2">
                              <button className="flex items-center gap-1 text-slate-600 hover:text-brandOrange font-medium">
                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5" />
                                </svg>
                                <span>{item.votes} citizens impacted</span>
                              </button>
                            </div>
                            <span className="text-[10px] font-mono text-slate-400">JMC Ward 12</span>
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {/* SCREEN 2: REPORT CAMERA (EDGE AI VIEWFINDER) */}
            {currentTab === 'camera' && (
              <div className="space-y-4 flex flex-col h-full">
                <div>
                  <h2 className="text-lg font-bold text-slate-900 tracking-tight">Camera Viewfinder</h2>
                  <p className="text-xs text-slate-500">Edge AI Photometry & TFLite Pothole Detection</p>
                </div>

                {/* Sleek Camera Viewfinder Box */}
                <div className="relative rounded-2xl overflow-hidden bg-black aspect-[3/4] border-2 border-slate-800 shadow-lg flex flex-col justify-between p-4">
                  {/* Real road preview background */}
                  <img 
                    src="https://images.unsplash.com/photo-1515162816999-a0c47dc192f7?w=800&auto=format&fit=crop&q=80" 
                    alt="Road viewfinder"
                    className="absolute inset-0 w-full h-full object-cover opacity-80"
                  />

                  {/* Top HUD Stats */}
                  <div className="relative z-10 flex items-center justify-between text-white text-[11px] font-mono">
                    <div className="bg-black/60 backdrop-blur-md px-2.5 py-1 rounded-md flex items-center gap-1.5 border border-white/10">
                      <span className="w-2 h-2 rounded-full bg-brandGreen"></span>
                      <span>GPS: 32.7058°N, 74.8732°E</span>
                    </div>
                    <div className="bg-black/60 backdrop-blur-md px-2 py-1 rounded-md text-[10px] text-brandOrange font-bold border border-white/10">
                      TFLite NPU Active
                    </div>
                  </div>

                  {/* AI Detection Reticle / Target Bounding Box */}
                  <div className="relative z-10 my-auto flex flex-col items-center justify-center">
                    <div className="w-52 h-44 border-2 border-brandOrange rounded-lg relative flex flex-col justify-between p-2 shadow-[0_0_15px_rgba(232,118,12,0.4)]">
                      {/* Corner Target Accents */}
                      <div className="absolute -top-1 -left-1 w-3 h-3 border-t-2 border-l-2 border-white"></div>
                      <div className="absolute -top-1 -right-1 w-3 h-3 border-t-2 border-r-2 border-white"></div>
                      <div className="absolute -bottom-1 -left-1 w-3 h-3 border-b-2 border-l-2 border-white"></div>
                      <div className="absolute -bottom-1 -right-1 w-3 h-3 border-b-2 border-r-2 border-white"></div>

                      {/* Pill info on bounding box */}
                      <div className="self-start bg-brandOrange text-white text-[9px] font-bold px-2 py-0.5 rounded shadow">
                        POTHOLE DETECTED · 94.2%
                      </div>

                      <div className="self-end bg-black/70 backdrop-blur-sm text-white text-[8px] font-mono px-1.5 py-0.5 rounded border border-white/20">
                        Laplacian Variance: 342.1 (Sharp)
                      </div>
                    </div>
                    <span className="text-[10px] text-white/90 font-mono mt-2 bg-black/50 px-2 py-0.5 rounded backdrop-blur-sm">
                      Ward 12 · Trikuta Nagar Sector 4
                    </span>
                  </div>

                  {/* Bottom AI Telemetry Strip */}
                  <div className="relative z-10 bg-black/75 backdrop-blur-md p-2.5 rounded-xl border border-white/10 text-white text-[11px] font-mono flex items-center justify-between">
                    <div>
                      <div className="text-brandGreen font-bold">✓ Clarity: 93.8% PASS</div>
                      <div className="text-[9px] text-slate-300">SHA-256: 8F2A-91C8-3D4E</div>
                    </div>
                    <div className="text-right">
                      <div className="text-[9px] text-slate-400">Payload: 48 KB</div>
                      <div className="text-[9px] text-brandOrange font-semibold">ChaCha20 Envelope</div>
                    </div>
                  </div>
                </div>

                {/* Primary Orange CTA Button */}
                <button
                  onClick={handleSaveReportFromCamera}
                  className="w-full py-4 bg-brandOrange hover:bg-orange-600 active:scale-[0.98] text-white font-bold text-sm rounded-xl shadow-lg transition-all flex items-center justify-center gap-2"
                >
                  <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                  </svg>
                  <span>Secure in Offline Vault</span>
                </button>

                <p className="text-center text-[11px] text-slate-500 font-medium">
                  Stores directly to phone memory. Dispatches to JMC automatically when signal recovers.
                </p>
              </div>
            )}

            {/* SCREEN 3: OFFLINE VAULT & SYNC */}
            {currentTab === 'vault' && (
              <div className="space-y-4">
                
                {/* Header */}
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-lg font-bold text-slate-900 tracking-tight">Offline Vault</h2>
                    <p className="text-xs text-slate-500">ChaCha20 Encrypted On-Device Buffer</p>
                  </div>
                  <span className="bg-brandOrange/15 text-brandOrange font-bold text-xs px-2.5 py-1 rounded-full">
                    {queuedCount} Pending Upload
                  </span>
                </div>

                {/* Delta Sync Control Card */}
                <div className="bg-white rounded-xl border border-slate-200/80 p-4 shadow-sm space-y-3">
                  <div className="flex items-center justify-between">
                    <div>
                      <h3 className="text-sm font-bold text-slate-900">JMC Delta Sync Pipeline</h3>
                      <p className="text-[11px] text-slate-500">
                        {isOnline ? "4G link available to push buffered payloads" : "Waiting for network coverage in Ward 12"}
                      </p>
                    </div>
                    <span className={`w-2.5 h-2.5 rounded-full ${isOnline ? 'bg-brandGreen animate-ping' : 'bg-brandRed'}`}></span>
                  </div>

                  {/* Sync progress bar */}
                  {isSyncing && (
                    <div className="space-y-1.5 pt-1">
                      <div className="flex justify-between text-[10px] font-mono text-slate-500">
                        <span>Uploading delta batch...</span>
                        <span>{syncProgress}%</span>
                      </div>
                      <div className="w-full bg-slate-100 rounded-full h-2 overflow-hidden">
                        <div 
                          className="bg-brandGreen h-full transition-all duration-300 rounded-full"
                          style={{ width: `${syncProgress}%` }}
                        ></div>
                      </div>
                    </div>
                  )}

                  {/* Sync Trigger Button */}
                  <button
                    onClick={handleSyncVault}
                    disabled={isSyncing || queuedCount === 0}
                    className={`w-full py-2.5 px-4 rounded-lg font-semibold text-xs transition-all flex items-center justify-center gap-2 ${
                      queuedCount === 0 
                        ? 'bg-slate-100 text-slate-400 cursor-not-allowed'
                        : isOnline
                        ? 'bg-brandGreen hover:bg-emerald-700 text-white shadow-md active:scale-[0.98]'
                        : 'bg-slate-200 text-slate-600 hover:bg-slate-300'
                    }`}
                  >
                    {isSyncing ? (
                      <span>Syncing {queuedCount} records...</span>
                    ) : queuedCount === 0 ? (
                      <span>✓ All Local Records Synced</span>
                    ) : (
                      <>
                        <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                        </svg>
                        <span>{isOnline ? `Upload ${queuedCount} Buffered Reports Now` : "Simulate 4G & Upload"}</span>
                      </>
                    )}
                  </button>
                </div>

                {/* Queue Items List */}
                <div className="space-y-2">
                  <h3 className="text-xs font-bold text-slate-600 uppercase tracking-wider">Encrypted SQLite Records</h3>
                  
                  {reports.map((item, idx) => {
                    const isQueued = item.status === 'QUEUED';
                    return (
                      <div 
                        key={item.id} 
                        className="bg-white rounded-xl border border-slate-200/80 p-3 shadow-sm flex items-center justify-between gap-3"
                      >
                        <div className="flex items-center gap-3">
                          <img 
                            src={item.imageUrl} 
                            alt={item.title} 
                            className="w-12 h-12 rounded-lg object-cover bg-slate-100 shrink-0" 
                          />
                          <div>
                            <div className="text-xs font-bold text-slate-900 leading-tight">{item.title}</div>
                            <div className="text-[10px] text-slate-500 mt-0.5">{item.location}</div>
                            <div className="text-[9px] font-mono text-slate-400 mt-0.5">SHA: {item.hash || "8F2A-91C8"} · 48 KB</div>
                          </div>
                        </div>

                        <div className="text-right shrink-0">
                          {isQueued ? (
                            <span className="inline-block bg-orange-100 text-brandOrange text-[10px] font-bold px-2 py-0.5 rounded-full">
                              Waiting
                            </span>
                          ) : (
                            <span className="inline-block bg-emerald-100 text-brandGreen text-[10px] font-bold px-2 py-0.5 rounded-full">
                              Synced
                            </span>
                          )}
                          <div className="text-[9px] text-slate-400 font-mono mt-1">{item.timeAgo}</div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* 3. FIXED BOTTOM NAVIGATION BAR */}
          <nav className="absolute bottom-0 left-0 right-0 bg-white border-t border-slate-200/80 px-4 py-2 flex items-center justify-around z-30 shadow-[0_-4px_10px_rgba(0,0,0,0.03)]">
            
            {/* Tab 1: Home */}
            <button
              onClick={() => setCurrentTab('home')}
              className={`flex flex-col items-center gap-1 transition-colors ${
                currentTab === 'home' ? 'text-brandOrange' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={currentTab === 'home' ? "2.5" : "2"} d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
              </svg>
              <span className="text-[10px] font-semibold">Home</span>
            </button>

            {/* Tab 2: Highlighted Camera FAB in center */}
            <button
              onClick={() => setCurrentTab('camera')}
              className="flex flex-col items-center -mt-5 group"
            >
              <div className={`w-13 h-13 p-3 rounded-full bg-brandOrange text-white shadow-lg transition-transform active:scale-95 group-hover:bg-orange-600 border-4 border-appBg flex items-center justify-center ${
                currentTab === 'camera' ? 'ring-2 ring-brandOrange/50' : ''
              }`}>
                <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.2" d="M15 13a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
              </div>
              <span className="text-[10px] font-bold text-slate-700 mt-1">Report</span>
            </button>

            {/* Tab 3: Vault with Badge */}
            <button
              onClick={() => setCurrentTab('vault')}
              className={`flex flex-col items-center gap-1 relative transition-colors ${
                currentTab === 'vault' ? 'text-brandOrange' : 'text-slate-400 hover:text-slate-600'
              }`}
            >
              <div className="relative">
                <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={currentTab === 'vault' ? "2.5" : "2"} d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4" />
                </svg>
                {queuedCount > 0 && (
                  <span className="absolute -top-1.5 -right-2 bg-brandOrange text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center shadow-xs">
                    {queuedCount}
                  </span>
                )}
              </div>
              <span className="text-[10px] font-semibold">My Vault</span>
            </button>
          </nav>

        </div>
      );
    }

    ReactDOM.render(<MobileApp />, document.getElementById('root'));
  </script>
</body>
</html>
